name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les données
        run: python3 -c "import json; json.load(open('data/data.json', encoding='utf-8'))"

      - name: Préparer le site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js assets data _site/
          touch _site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

      - name: Publier sur la branche gh-pages
        working-directory: _site
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publication de ${GITHUB_SHA}"
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
